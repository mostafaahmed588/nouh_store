<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouh Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">
            Nouh Store<span>.</span>
        </div>
        <div class="icons">
            <a href="https://wa.me/201153122477" target="_blank">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
            <a href="https://www.facebook.com/share/18yWYD1yAU/" target="_blank">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="https://www.instagram.com/nouh_brand111?igsh=N2puMm50eHAzeDhl" target="_blank">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <div class="cart-icon">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count">0</span>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <div class="overlay"></div>
        <div class="content">
            <h1>New Collection 2026</h1>
            <p>اكتشف أحدث صيحات الموضة بأفضل الأسعار.</p>
            <a href="#products">تسوق الآن</a>
        </div>
    </section>

    <!-- Products -->
    <section class="products" id="products">
        <h2>أحدث المنتجات</h2>
        <!-- تم إضافة id="products-container" هنا ليتم ربطه بملف script.js -->
        <div class="products-container" id="products-container">
            <!-- سيتم جلب المنتجات تلقائياً من Firebase بواسطة ملف script.js -->
        </div>
    </section>

    <!-- سلة المشتريات -->
    <section class="cart-section">
        <h2>🛒 سلة المشتريات</h2>
        <div id="cart-items">
            <p>لا توجد منتجات في السلة.</p>
        </div>
        <h3>الإجمالي: <span id="total-price">0</span> جنيه</h3>
        <button id="checkout-btn">إتمام الطلب</button>
    </section>

    <!-- صفحة إتمام الطلب -->
    <section class="checkout-section" id="checkout-section">
        <h2>إتمام الطلب</h2>
        <form id="checkout-form">
            <input type="text" id="name" placeholder="الاسم بالكامل" required>
            <input type="tel" id="phone" placeholder="رقم الهاتف" required>
            <textarea id="address" placeholder="العنوان بالكامل" required></textarea>
            
            <select id="payment" required>
                <option value="الدفع عند الاستلام" selected>💵 الدفع عند الاستلام</option>
            </select>
            
            <button type="submit">تأكيد الطلب</button>
        </form>
    </section>

    <footer>
        <hr>
        <p>Designed & Developed by <span>Eng Mostafa Ahmed</span> © 2026</p>
    </footer>

    <script type="module" src="script.js"></script>
</body>
</html>
