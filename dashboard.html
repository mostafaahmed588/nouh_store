<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nouh Store - لوحة التحكم</title>

    <link rel="stylesheet" href="dashboard.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"
        rel="stylesheet">

</head>

<body>

    <header class="dashboard-header">

        <div>
            <h1>Nouh Store</h1>
            <p>لوحة تحكم صاحب المحل</p>
        </div>

        <button id="logout-btn">
            تسجيل الخروج
        </button>

    </header>


    <main class="dashboard">

        <section class="welcome-box">

            <h2>أهلاً بك 👋</h2>

            <p>
                من هنا تقدر تضيف منتجات جديدة للمحل،
                وتعدل المنتجات أو تحذفها.
            </p>

        </section>


        <section class="add-product">

            <h2>إضافة منتج جديد</h2>

            <form id="product-form">

                <input
                    type="text"
                    id="product-name"
                    placeholder="اسم المنتج"
                    required
                >

                <input
                    type="number"
                    id="product-price"
                    placeholder="السعر بالجنيه"
                    required
                >

                <input
                    type="text"
                    id="product-image"
                    placeholder="رابط صورة المنتج"
                    required
                >

                <textarea
                    id="product-description"
                    placeholder="وصف المنتج"
                ></textarea>

                <button type="submit">
                    إضافة المنتج
                </button>

            </form>

            <p id="product-message"></p>

        </section>


        <section class="products-admin">

            <h2>المنتجات الموجودة</h2>

            <div id="admin-products">

                <p>جاري تحميل المنتجات...</p>

            </div>

        </section>

    </main>


    <script type="module" src="dashboard.js"></script>

</body>

</html>
